# On the SM-X810, WirePlumber's V4L2 monitor prevents the ALSA speaker sink
# from getting its playback ports linked. Keep audio and libcamera monitoring
# enabled, but do not run the generic V4L2 enumerator for this device.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}

# The same ALSA controller can also appear as a compressed-offload card. It is
# not the UCM-backed speaker path and WirePlumber must not select it instead.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.comprC0" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
