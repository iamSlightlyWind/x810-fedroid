SectionVerb {
	EnableSequence [
		# Frontend -> backend: MultiMedia1 feeds PRIMARY_MI2S_RX, which is
		# where the four CS35L45 amplifiers listen.
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# X810 CYG1 uses the TX macro's TX_CODEC_DMA_TX_3 capture lane.
		# This is a two-channel mixer control; both left and right capture
		# channels must feed the TX macro.
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1,1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in speakers (4x CS35L45)"

	EnableSequence [
		cset "name='Front Left AMP Enable Switch' 1"
		cset "name='Front Right AMP Enable Switch' 1"
		cset "name='Rear Left AMP Enable Switch' 1"
		cset "name='Rear Right AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='Front Left AMP Enable Switch' 0"
		cset "name='Front Right AMP Enable Switch' 0"
		cset "name='Rear Left AMP Enable Switch' 0"
		cset "name='Rear Right AMP Enable Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		# MultiMedia1 Playback
		PlaybackPCM "hw:${CardId},0"
		#
		# Deliberately no PlaybackMixer/PlaybackMixerElem.
		#
		# Volume lives in four independent per-amplifier controls with no
		# single master, so there is nothing sensible to hand the sound
		# server: given a mixer it flags the sink HARDWARE, stops applying
		# software attenuation, and writes to a control that does not move
		# the output - the desktop slider then does nothing.  Without one
		# it attenuates in software, which works and keeps all four
		# amplifiers in step.  The hardware volumes are pinned near maximum
		# in the card's BootSequence so that full-scale really is full.
	}
}

SectionDevice."Mic" {
	Comment "Built-in digital microphones"

	EnableSequence [
		# The desktop stereo-recording path matches Samsung's CYG1
		# rec-stereo-mic -> sub-main-mic route: TX DEC0/1 with DMIC3/1
		# on MUX0/1. Do not use handset-dmic-endfire's DEC1/2 path here;
		# a live X810 test of that path opened PCM2 but produced no samples.
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX0' DMIC3"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX1' DMIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX DEC2 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX2' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX DMIC MUX0' ZERO"
		cset "name='TX DMIC MUX1' ZERO"
		cset "name='TX DMIC MUX2' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		# MultiMedia3 Capture (TX macro on X810)
		CapturePCM "hw:${CardId},2"
		# Software volume here too: the TX decimator gains are per-channel
		# and there is no master capture control to expose.
	}
}
