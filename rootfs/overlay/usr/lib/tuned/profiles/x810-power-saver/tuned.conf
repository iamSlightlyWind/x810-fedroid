# X810 has no ACPI platform profile control.  TuneD's generic powersave
# profile prefers schedutil when it exists, which can still boost to the full
# policy maximum under a CPU benchmark.  Force the kernel's CPUFreq powersave
# governor for an observable battery/thermal-saving mode, while inheriting
# TuneD's remaining generic power-saving tunables.
[main]
summary=X810 CPUFreq powersave with generic TuneD power-saving settings
include=powersave

[cpu]
governor=powersave
