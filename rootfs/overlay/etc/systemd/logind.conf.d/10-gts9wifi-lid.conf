#
# Deep suspend has previously failed to resume on this X810 port. Until its
# wake path is diagnosed, a cover close must not enter the unverified suspend
# path. The sleep targets are masked separately so desktop/user initiated
# suspend is blocked too.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HoldoffTimeoutSec=0
