[Unit]
# Serialize behind the panel recovery: starting the ADSP concurrently with
# the pm_test suspend cycle froze the SoC outright (observed on hardware).
Requires=gts9wifi-panel-coldboot-recover.service
After=gts9wifi-panel-coldboot-recover.service
Requires=vendor-firmware_mnt.mount
After=vendor-firmware_mnt.mount
