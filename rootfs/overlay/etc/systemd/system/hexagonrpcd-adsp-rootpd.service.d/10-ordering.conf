[Unit]
# The stock unit is preset-enabled for multi-user.target, before the deferred
# ADSP boot helper creates /dev/fastrpc-adsp.  Ordering alone does not pull in
# the disabled helper, so systemd evaluates ConditionPathExists too early and
# permanently skips rootpd for this boot.  Pull in the same panel-ordered ADSP
# helper as sensorspd and pd-mapper; the helper itself is gated behind panel
# cold-boot recovery and the read-only CYG1 firmware mount.
Requires=gts9wifi-adsp-boot.service
After=gts9wifi-adsp-boot.service
