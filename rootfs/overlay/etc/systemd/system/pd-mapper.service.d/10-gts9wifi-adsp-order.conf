# pd-mapper resolves QRTR protection-domain names and reads its PD maps from
# the active ADSP firmware directory. This port starts ADSP late because its
# firmware lives on the rootfs; do not let the enabled mapper run before that
# late remoteproc start. Match the X910 Ubuntu/pmOS ordering workaround while
# using this port's panel-ordered ADSP unit name.
[Unit]
After=gts9wifi-adsp-boot.service
Wants=gts9wifi-adsp-boot.service

[Service]
Restart=on-failure
RestartSec=3
