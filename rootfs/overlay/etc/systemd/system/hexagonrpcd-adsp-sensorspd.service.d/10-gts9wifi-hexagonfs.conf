[Unit]
Requires=gts9wifi-adsp-boot.service gts9wifi-sensor-registry-perms.service
After=gts9wifi-adsp-boot.service pd-mapper.service gts9wifi-sensor-registry-perms.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /run/gts9wifi-hexagonfs
# A failed sensor-PD attach can SSR the shared ADSP. Do not enter an automatic
# crash loop: one controlled attempt per boot is enough, and audio can recover.
Restart=no
