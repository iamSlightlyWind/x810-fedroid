name: Fedora rootfs

on:
  workflow_call:
    inputs:
      fedora_release:
        description: "Fedora release to build against"
        required: false
        default: "44"
        type: string
      fedora_base_compose:
        description: "Immutable Fedora Everything base compose (must match the selected Fedora release)"
        required: false
        default: "Fedora-44-20260422.1"
        type: string
      fedora_updates_compose:
        description: "Immutable Fedora updates compose (must match the selected Fedora release)"
        required: false
        default: "Fedora-44-updates-20260926.0"
        type: string
      desktop:
        description: "gnome = release image (Workstation + device stack + firmware + kernel); core = headless debug image"
        required: false
        default: "gnome"
        type: string
      port_version:
        description: "Explicit Tab Companion port version (MAJOR.MINOR.PATCH); use unknown for debug/unreleased builds"
        required: false
        default: "0.1.0"
        type: string
      kernel_release_tag:
        description: "This repository's kernel build tag; the rootfs downloads its checksum-matched X810 RPM from it"
        required: true
        type: string
      kernel_rpm_sha256:
        description: "Exact RPM digest used in the rootfs input fingerprint"
        required: true
        type: string
      firmware_url:
        description: "Device firmware payload (extracted from the stock partitions)"
        required: false
        default: "https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-2/firmware-samsung-gts9wifi-v2.tar.gz"
        type: string
      firmware_sha256:
        description: "sha256 of the firmware payload"
        required: false
        default: "30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5"
        type: string
      release_tag:
        description: "Immutable rootfs release tag selected by the X810 Fedora orchestrator"
        required: true
        type: string
      build_key:
        description: "Expected rootfs input fingerprint from the orchestrator"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-rootfs:
    # Native arm64 like the pmOS kernel workflow — the rootfs build (dnf
    # installroot + three meson builds) runs natively inside a Fedora
    # aarch64 container, no qemu involved.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run rootfs Fedora signing-key contract test
        run: python3 tools/test-rootfs-repo-gpg.py

      - name: Verify planned rootfs fingerprint
        env:
          FEDORA_RELEASE: ${{ inputs.fedora_release }}
          FEDORA_BASE_COMPOSE: ${{ inputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ inputs.fedora_updates_compose }}
          GTS9_DESKTOP: ${{ inputs.desktop }}
          PORT_VERSION: ${{ inputs.port_version }}
          FIRMWARE_SHA256: ${{ inputs.firmware_sha256 }}
          KERNEL_RELEASE_TAG: ${{ inputs.kernel_release_tag }}
          KERNEL_RPM_SHA256: ${{ inputs.kernel_rpm_sha256 }}
          EXPECTED_BUILD_KEY: ${{ inputs.build_key }}
        run: |
          set -euo pipefail
          actual="$(python3 tools/x810-build-fingerprint.py rootfs \
            --fedora-release "$FEDORA_RELEASE" \
            --fedora-base-compose "$FEDORA_BASE_COMPOSE" \
            --fedora-updates-compose "$FEDORA_UPDATES_COMPOSE" \
            --desktop "$GTS9_DESKTOP" --port-version "$PORT_VERSION" \
            --firmware-sha256 "$FIRMWARE_SHA256" \
            --kernel-rpm-sha256 "$KERNEL_RPM_SHA256")"
          [ "$actual" = "$EXPECTED_BUILD_KEY" ] || {
            echo "REFUSING: rootfs build inputs changed after planning." >&2; exit 1;
          }

      - name: Restore DNF cache for exact immutable Fedora composes
        id: restore_dnf_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-dnf-rootfs-cache
          key: x810-dnf-rootfs-${{ runner.arch }}-${{ inputs.fedora_release }}-${{ inputs.fedora_base_compose }}-${{ inputs.fedora_updates_compose }}

      - name: Fetch pinned firmware payload
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
          FIRMWARE_SHA256: ${{ inputs.firmware_sha256 }}
        run: |
          mkdir -p _ci
          curl -sfL "$FIRMWARE_URL" -o _ci/firmware.tar.gz
          echo "$FIRMWARE_SHA256  _ci/firmware.tar.gz" | sha256sum -c -

      - name: Download the exact RPM from this repository's X810 kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RELEASE_TAG: ${{ inputs.kernel_release_tag }}
          KERNEL_RPM_SHA256: ${{ inputs.kernel_rpm_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p _ci/kernel
          gh release download "$KERNEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'linux-gts9wifi-*.rpm' --pattern RPM-SHA256SUMS --dir _ci/kernel
          (cd _ci/kernel && sha256sum -c RPM-SHA256SUMS)
          shopt -s nullglob
          rpms=(_ci/kernel/linux-gts9wifi-*.rpm)
          [ "${#rpms[@]}" -eq 1 ] || {
            echo "REFUSING: kernel release must contain exactly one X810 linux-gts9wifi RPM." >&2
            exit 1
          }
          cp "${rpms[0]}" _ci/kernel.rpm
          echo "$KERNEL_RPM_SHA256  _ci/kernel.rpm" | sha256sum -c -

      - name: Build rootfs in Fedora aarch64 container
        id: build_rootfs_image
        env:
          PORT_VERSION: ${{ inputs.port_version }}
          FEDORA_RELEASE: ${{ inputs.fedora_release }}
          FEDORA_BASE_COMPOSE: ${{ inputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ inputs.fedora_updates_compose }}
          GTS9_DESKTOP: ${{ inputs.desktop }}
          FIRMWARE_URL: ${{ inputs.firmware_url }}
          BUILD_KEY: ${{ inputs.build_key }}
        run: |
          mkdir -p "$RUNNER_TEMP/x810-dnf-rootfs-cache"
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$RUNNER_TEMP/x810-dnf-rootfs-cache:/x810-dnf-cache" \
            -e FEDORA_RELEASE \
            -e FEDORA_BASE_COMPOSE \
            -e FEDORA_UPDATES_COMPOSE \
            -e GTS9_DESKTOP \
            -e PORT_VERSION \
            -e FIRMWARE_TARBALL=/work/_ci/firmware.tar.gz \
            -e FIRMWARE_SOURCE_URL="$FIRMWARE_URL" \
            -e KERNEL_RPM=/work/_ci/kernel.rpm \
            -e X810_DNF_CACHE_DIR=/x810-dnf-cache \
            -e BUILDER_IMAGE=quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a \
            quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a \
            ./rootfs/build-rootfs.sh
          # The container writes out/ as root; hand it to the runner user so
          # the key and checksum files can be added next to the build output.
          sudo chown -R "$(id -u):$(id -g)" out
          printf '%s\n' "$BUILD_KEY" > out/ROOTFS-BUILD-KEY.txt

      # DNF packages and metadata are immutable-compose inputs, separate from
      # the freshly created installroot. Preserve valid downloads even when a
      # later RPM/file-conflict check fails inside build-rootfs.sh. DNF checks
      # package checksums and signatures again when the cache is reused.
      - name: Finalize external DNF cache after build attempt
        id: finalize_dnf_cache
        if: ${{ always() && !cancelled() && steps.build_rootfs_image.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/x810-dnf-rootfs-cache"
          mkdir -p "$cache_dir"
          sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
          # Never persist an interrupted package/metadata download fragment.
          find "$cache_dir" -type f \( -name '*.part' -o -name '*.tmp' \) -delete
          if find "$cache_dir" -type f -print -quit | grep -q .; then
            echo "has_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save DNF cache for exact immutable Fedora composes
        if: ${{ always() && !cancelled() && steps.restore_dnf_cache.outputs.cache-hit != 'true' && steps.finalize_dnf_cache.outcome == 'success' && steps.finalize_dnf_cache.outputs.has_cache == 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-dnf-rootfs-cache
          key: x810-dnf-rootfs-${{ runner.arch }}-${{ inputs.fedora_release }}-${{ inputs.fedora_base_compose }}-${{ inputs.fedora_updates_compose }}

      - name: Checksum
        run: |
          cd out
          shopt -s nullglob
          assets=( *.tar.gz *.rpm rootfs-manifest.txt ROOTFS-BUILD-KEY.txt )
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The runner uploads straight to the release: there is no API to turn an
      # Actions artifact into a release asset, and doing it from here avoids a
      # ~2 GB download/upload round-trip through a personal machine.  --clobber
      # replaces same-named assets, so the tag keeps a stable asset set.  This
      # is the run's only output — no Actions artifacts are uploaded.
      - name: Publish assets to the named release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release_tag }}
        run: |
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --title "$REL" --latest=false \
              --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release edit "$REL" --latest=false
          shopt -s nullglob
          assets=(out/*.tar.gz out/*.rpm out/rootfs-manifest.txt out/SHA256SUMS out/ROOTFS-BUILD-KEY.txt)
          gh release upload "$REL" --clobber "${assets[@]}"
