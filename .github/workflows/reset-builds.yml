name: Reset X810 Fedora builds

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET X810 FEDORA BUILDS to rebuild every component and prune old releases (dependency caches are kept)
        required: true
        type: string

permissions:
  actions: write
  contents: write

# Serialize the reset against ordinary builds. The combined reusable workflow
# child has its own lock to avoid parent/child deadlock. Build caches are kept.
concurrency:
  group: x810-fedora-build-release
  cancel-in-progress: false

jobs:
  validate-reset:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit destructive-action confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Reset is allowed only from main." >&2; exit 1;
          }
          [[ "$CONFIRMATION" == "RESET X810 FEDORA BUILDS" ]] || {
            echo "Type the exact confirmation phrase; no releases were changed." >&2
            exit 1
          }

  full-image:
    needs: validate-reset
    uses: ./.github/workflows/x810-fedora.yml
    permissions:
      contents: write
    with:
      force_rebuild: true
      desktop: gnome

  prune-old-releases:
    needs: [full-image]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - name: Keep only this reset's X810 component releases
        env:
          GH_TOKEN: ${{ github.token }}
          RESET_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          latest_push_run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/x810-fedora.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | max_by(.run_number).id // empty' 2>/dev/null || true)
          keep_push_tag=""
          [[ -z "$latest_push_run" ]] || keep_push_tag="x810-fedora-port-build-${latest_push_run}"
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName --jq '.[].tagName')
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            case "$tag" in
              x810-fedora-port-build-*)
                [[ "$tag" == "x810-fedora-port-build-${RESET_RUN_ID}" || \
                   "$tag" == "$keep_push_tag" ]] && continue
                if [[ "$tag" =~ ^x810-fedora-port-build-([0-9]+)$ ]] && \
                   (( BASH_REMATCH[1] < RESET_RUN_ID )); then
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
                fi
                ;;
              x810-kernel-*|x810-rootfs-*|x810-fedora-*)
                [[ "$tag" == *"-r${RESET_RUN_ID}" ]] && continue
                if [[ "$tag" =~ -r([0-9]+)$ ]] && (( BASH_REMATCH[1] >= RESET_RUN_ID )); then
                  continue
                fi
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
                ;;
            esac
          done <<< "$tags"
          echo "Kept this reset's rebuilt kernel, rootfs, full-set, and support-RPM releases plus the latest push updater; dependency caches were preserved."
