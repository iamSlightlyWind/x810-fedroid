name: X810 Fedora build and release

on:
  push:
    branches: [main]
    paths:
      - "PORT_VERSION"
      - "kernel/**"
      - "boot/**"
      - "rootfs/**"
      - "specs/**"
      - "tools/**"
      - ".github/workflows/x810-fedora.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Build new kernel, rootfs, and combined release even if matching successful builds exist"
        type: boolean
        default: false
      bootstrap_kernel_tag:
        description: "Legacy kernel release to use only when its source/input fingerprint matches this checkout"
        type: string
        default: "kernel-7.2.0-gts9wifi-1"
      port_version:
        description: "Optional MAJOR.MINOR.PATCH override; blank uses PORT_VERSION"
        type: string
        default: ""
      desktop:
        description: "Fedora image profile"
        type: choice
        options: [gnome, core]
        default: gnome
      fedora_base_compose:
        description: "Pinned Fedora Everything compose"
        type: string
        default: "Fedora-44-20260422.1"
      fedora_updates_compose:
        description: "Pinned Fedora updates compose"
        type: string
        default: "Fedora-44-updates-20260926.0"

permissions:
  contents: write

env:
  KVER: 7.2.0-gts9wifi

concurrency:
  group: x810-fedora-build-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      kernel_key: ${{ steps.plan.outputs.kernel_key }}
      kernel_tag: ${{ steps.plan.outputs.kernel_tag }}
      build_kernel: ${{ steps.plan.outputs.build_kernel }}
      bootstrap_kernel: ${{ steps.plan.outputs.bootstrap_kernel }}
      force_rebuild: ${{ steps.plan.outputs.force_rebuild }}
      port_version: ${{ steps.plan.outputs.port_version }}
      desktop: ${{ steps.plan.outputs.desktop }}
      fedora_base_compose: ${{ steps.plan.outputs.fedora_base_compose }}
      fedora_updates_compose: ${{ steps.plan.outputs.fedora_updates_compose }}
    steps:
      - name: Checkout full history for legacy fingerprint verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run lightweight planner and rootfs integrity contract tests
        run: |
          python3 tools/test-x810-build-fingerprint.py
          python3 tools/test-rootfs-repo-gpg.py
          python3 tools/test-rootfs-zram-config.py
          python3 tools/test-port-rpm-staging.py
          python3 tools/test-x810-rootfs-archive.py

      - name: Compare inputs with successful component releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_KERNEL_TAG: ${{ inputs.bootstrap_kernel_tag || 'kernel-7.2.0-gts9wifi-1' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          PORT_VERSION_INPUT: ${{ inputs.port_version || '' }}
          DESKTOP: ${{ inputs.desktop || 'gnome' }}
          FEDORA_BASE_COMPOSE: ${{ inputs.fedora_base_compose || 'Fedora-44-20260422.1' }}
          FEDORA_UPDATES_COMPOSE: ${{ inputs.fedora_updates_compose || 'Fedora-44-updates-20260926.0' }}
          FIRMWARE_SHA256: "30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5"
        run: |
          set -euo pipefail
          port_version="$PORT_VERSION_INPUT"
          if [ -z "$port_version" ]; then port_version="$(tr -d '\r\n ' < PORT_VERSION)"; fi
          [[ "$port_version" =~ ^(0|[1-9][0-9]{0,19})\.(0|[1-9][0-9]{0,19})\.(0|[1-9][0-9]{0,19})$ ]] || {
            echo "REFUSING: port version must be numeric MAJOR.MINOR.PATCH." >&2; exit 1;
          }
          [[ "$DESKTOP" == gnome || "$DESKTOP" == core ]] || exit 1

          kernel_key="$(python3 tools/x810-build-fingerprint.py kernel \
            --ref "$GITHUB_SHA" --firmware-sha256 "$FIRMWARE_SHA256" \
            --fedora-base-compose "$FEDORA_BASE_COMPOSE" \
            --fedora-updates-compose "$FEDORA_UPDATES_COMPOSE")"
          kernel_base="x810-kernel-${kernel_key:0:16}"
          force=false
          [ "$FORCE_REBUILD" != true ] || force=true
          if [ "$force" = true ]; then
            kernel_tag="${kernel_base}-r${GITHUB_RUN_ID}"
            build_kernel=true
            bootstrap_kernel=false
          else
            reusable=""
            release_list="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json tagName,publishedAt --jq \
              "sort_by(.publishedAt) | reverse | map(select(.tagName | startswith(\"${kernel_base}\"))) | .[].tagName" 2>/dev/null || true)"
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              dir="$RUNNER_TEMP/kernel-check-${GITHUB_RUN_ID}-${RANDOM}"
              mkdir -p "$dir"
              if gh release download "$candidate" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
                  --pattern KERNEL-BUILD-KEY.txt --pattern BUNDLE-SHA256SUMS \
                  --pattern RPM-SHA256SUMS --pattern 'linux-gts9wifi-*.rpm' --pattern '*.img' \
                  --pattern 'gts9wifi-fedora-*.zip' >/dev/null 2>&1 && \
                 [ "$(cat "$dir/KERNEL-BUILD-KEY.txt" 2>/dev/null || true)" = "$kernel_key" ] && \
                 (cd "$dir" && sha256sum -c BUNDLE-SHA256SUMS >/dev/null && sha256sum -c RPM-SHA256SUMS >/dev/null); then
                reusable="$candidate"
                break
              fi
            done <<< "$release_list"
            if [ -n "$reusable" ]; then
              kernel_tag="$reusable"
              build_kernel=false
              bootstrap_kernel=false
            else
              # One-time bootstrap for the existing manual release. Trust it
              # only if its own metadata proves exact build parameters and its
              # recorded source commit produces this very same component key.
              dir="$RUNNER_TEMP/kernel-bootstrap-${GITHUB_RUN_ID}"
              mkdir -p "$dir"
              bootstrap_ok=false
              if gh release download "$BOOTSTRAP_KERNEL_TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
                  --pattern BUILD-METADATA.txt --pattern BUNDLE-SHA256SUMS --pattern RPM-SHA256SUMS \
                  --pattern 'linux-gts9wifi-*.rpm' --pattern '*.img' --pattern 'gts9wifi-fedora-*.zip' >/dev/null 2>&1 && \
                 (cd "$dir" && sha256sum -c BUNDLE-SHA256SUMS >/dev/null && sha256sum -c RPM-SHA256SUMS >/dev/null); then
                field() {
                  python3 - "$dir/BUILD-METADATA.txt" "$1" <<'PY'
          import sys
          rows = [line.partition('=')[2].rstrip('\n') for line in open(sys.argv[1], encoding='utf-8') if line.startswith(sys.argv[2] + '=')]
          if len(rows) != 1: raise SystemExit(1)
          print(rows[0])
          PY
                }
                old_commit="$(field repository_commit || true)"
                old_key=""
                if [[ "$old_commit" =~ ^[0-9a-f]{40,64}$ ]] && git cat-file -e "$old_commit^{commit}" 2>/dev/null; then
                  old_key="$(python3 tools/x810-build-fingerprint.py kernel \
                    --ref "$old_commit" --firmware-sha256 "$FIRMWARE_SHA256" \
                    --fedora-base-compose "$FEDORA_BASE_COMPOSE" \
                    --fedora-updates-compose "$FEDORA_UPDATES_COMPOSE")"
                fi
                if [ "$old_key" = "$kernel_key" ] && \
                   [ "$(field firmware_sha256 || true)" = "$FIRMWARE_SHA256" ] && \
                   [ "$(field builder_image || true)" = "quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a" ] && \
                   [ "$(field fedora_base_compose || true)" = "$FEDORA_BASE_COMPOSE" ] && \
                   [ "$(field fedora_updates_compose || true)" = "$FEDORA_UPDATES_COMPOSE" ]; then
                  bootstrap_ok=true
                fi
              fi
              if [ "$bootstrap_ok" = true ]; then
                kernel_tag="$BOOTSTRAP_KERNEL_TAG"
                build_kernel=false
                bootstrap_kernel=true
              else
                kernel_tag="$kernel_base"
                build_kernel=true
                bootstrap_kernel=false
              fi
            fi
          fi

          {
            echo "kernel_key=$kernel_key"
            echo "kernel_tag=$kernel_tag"
            echo "build_kernel=$build_kernel"
            echo "bootstrap_kernel=$bootstrap_kernel"
            echo "force_rebuild=$force"
            echo "port_version=$port_version"
            echo "desktop=$DESKTOP"
            echo "fedora_base_compose=$FEDORA_BASE_COMPOSE"
            echo "fedora_updates_compose=$FEDORA_UPDATES_COMPOSE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### X810 Fedora release plan"
            echo "- Kernel/boot: **$([ "$build_kernel" = true ] && echo build || echo reuse)** `$kernel_tag`"
            echo "- Rootfs: fingerprint and reuse check follows kernel verification."
            echo "- Port version: `$port_version`; profile: `$DESKTOP`."
          } >> "$GITHUB_STEP_SUMMARY"

  build_kernel:
    needs: plan
    if: needs.plan.outputs.build_kernel == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify planned kernel fingerprint
        env:
          FIRMWARE_SHA256: 30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5
          FEDORA_BASE_COMPOSE: ${{ needs.plan.outputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ needs.plan.outputs.fedora_updates_compose }}
          EXPECTED_BUILD_KEY: ${{ needs.plan.outputs.kernel_key }}
        run: |
          set -euo pipefail
          actual="$(python3 tools/x810-build-fingerprint.py kernel \
            --firmware-sha256 "$FIRMWARE_SHA256" \
            --fedora-base-compose "$FEDORA_BASE_COMPOSE" \
            --fedora-updates-compose "$FEDORA_UPDATES_COMPOSE")"
          [ "$actual" = "$EXPECTED_BUILD_KEY" ] || {
            echo "REFUSING: kernel build inputs changed after planning." >&2; exit 1;
          }

      - name: Restore kernel source and ccache
        id: restore_kernel_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-kernel-cache
          key: x810-kernel-${{ runner.arch }}-linux72-${{ hashFiles('kernel/**') }}
          restore-keys: |
            x810-kernel-${{ runner.arch }}-linux72-

      - name: Restore Fedora DNF cache for pinned kernel composes
        id: restore_kernel_dnf
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-dnf-kernel-cache
          key: x810-dnf-kernel-${{ runner.arch }}-${{ needs.plan.outputs.fedora_base_compose }}-${{ needs.plan.outputs.fedora_updates_compose }}

      - name: Build kernel RPM, initramfs, boot bundle and TWRP zip
        env:
          FIRMWARE_URL: https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-2/firmware-samsung-gts9wifi-v2.tar.gz
          FIRMWARE_SHA256: 30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5
          FEDORA_BASE_COMPOSE: ${{ needs.plan.outputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ needs.plan.outputs.fedora_updates_compose }}
          LINUX_SOURCE_SHA256: "f9fef3d14c0df53819026f4be74459835c2a0b0dcbf5b5bbd9ea19f0829402b3"
          BUILD_SOURCE_SHA: ${{ github.sha }}
          BUILD_KEY: ${{ needs.plan.outputs.kernel_key }}
        run: |
          mkdir -p "$RUNNER_TEMP/x810-kernel-cache/ccache" "$RUNNER_TEMP/x810-dnf-kernel-cache"
          docker run --rm \
            -e KVER -e FIRMWARE_URL -e FIRMWARE_SHA256 \
            -e FEDORA_BASE_COMPOSE -e FEDORA_UPDATES_COMPOSE \
            -e LINUX_SOURCE_SHA256 -e BUILD_SOURCE_SHA -e BUILD_KEY \
            -e CCACHE_DIR=/x810-cache/ccache \
            -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=6G \
            -v "$PWD:/work" -w /work \
            -v "$RUNNER_TEMP/x810-kernel-cache:/x810-cache" \
            -v "$RUNNER_TEMP/x810-dnf-kernel-cache:/var/cache/libdnf5" \
            quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a \
            bash -lc '
              set -euxo pipefail
              repo_root=https://kojipkgs.fedoraproject.org/compose
              [[ "$FEDORA_BASE_COMPOSE" =~ ^Fedora-44-[0-9]{8}\.[0-9]+$ ]]
              [[ "$FEDORA_UPDATES_COMPOSE" =~ ^Fedora-44-updates-[0-9]{8}\.[0-9]+$ ]]
              base_url="$repo_root/44/$FEDORA_BASE_COMPOSE/compose/Everything/aarch64/os/"
              updates_url="$repo_root/updates/$FEDORA_UPDATES_COMPOSE/compose/Everything/aarch64/os/"
              repo_args=(--disablerepo="*" \
                --repofrompath=x810-fedora-snapshot,"$base_url" \
                --repofrompath=x810-updates-snapshot,"$updates_url" \
                --setopt=cachedir=/var/cache/libdnf5 \
                --setopt=system_cachedir=/var/cache/libdnf5 \
                --setopt=keepcache=True \
                --setopt=x810-fedora-snapshot.gpgcheck=1 \
                --setopt=x810-updates-snapshot.gpgcheck=1 \
                --enablerepo=x810-fedora-snapshot --enablerepo=x810-updates-snapshot)
              dnf -y "${repo_args[@]}" install make gcc clang lld llvm bc flex bison perl \
                  openssl openssl-devel elfutils-libelf-devel python3 tar xz \
                  zstd rpm-build ccache dtc findutils dwarves dracut \
                  cpio lz4 iproute >/dev/null
              mkdir -p /x810-cache/ccache-bin
              ln -sf "$(command -v ccache)" /x810-cache/ccache-bin/clang
              export PATH="/x810-cache/ccache-bin:$PATH"
              mkdir -p /x810-cache
              if [ ! -s /x810-cache/linux-7.2.tar.xz ] || \
                 [ "$(sha256sum /x810-cache/linux-7.2.tar.xz | cut -d" " -f1)" != "$LINUX_SOURCE_SHA256" ]; then
                rm -f /x810-cache/linux-7.2.tar.xz /x810-cache/linux-7.2.tar.xz.part
                curl -sfL https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.tar.xz \
                  -o /x810-cache/linux-7.2.tar.xz.part
                echo "$LINUX_SOURCE_SHA256  /x810-cache/linux-7.2.tar.xz.part" | sha256sum -c -
                mv /x810-cache/linux-7.2.tar.xz.part /x810-cache/linux-7.2.tar.xz
              fi
              echo "$LINUX_SOURCE_SHA256  /x810-cache/linux-7.2.tar.xz" | sha256sum -c -
              tar xf /x810-cache/linux-7.2.tar.xz
              cd linux-7.2
              export SOURCE_DATE_EPOCH=0
              export KBUILD_BUILD_TIMESTAMP="1970-01-01 00:00:00 UTC"
              export KBUILD_BUILD_USER=x810-reproducible KBUILD_BUILD_HOST=x810-reproducible
              export LC_ALL=C
              bash /work/kernel/prepare.sh .
              echo "-gts9wifi" > localversion-gts9wifi
              cd ..
              mv linux-7.2 linux-prepared
              tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner \
                --format=gnu -C . -cf - linux-prepared | gzip -n -9 > linux-prepared.tar.gz
              rm -rf linux-prepared
              mkdir -p ~/rpmbuild/SOURCES out-kernel out-bundle out-twrp
              cp linux-prepared.tar.gz ~/rpmbuild/SOURCES/
              rpmbuild -bb --define "kversion 7.2.0" /work/kernel/kernel.spec
              cp ~/rpmbuild/RPMS/aarch64/*.rpm out-kernel/
              dnf -y "${repo_args[@]}" install out-kernel/*.rpm
              curl -sfL "$FIRMWARE_URL" -o /tmp/fw.tar.gz
              echo "$FIRMWARE_SHA256  /tmp/fw.tar.gz" | sha256sum -c -
              tar xzf /tmp/fw.tar.gz -C /
              cp -a /work/boot/dracut/90gts9wifi-usbnet /usr/lib/dracut/modules.d/
              cp /work/boot/dracut/dracut.conf.d/gts9wifi.conf /usr/lib/dracut/dracut.conf.d/
              dracut --kver "$KVER" --force /tmp/initramfs.img
              bash /work/boot/build-bundle.sh \
                --vmlinuz /boot/vmlinuz-"$KVER" \
                --dtb /boot/dtbs-7.2.0-gts9wifi/qcom/sm8550-samsung-gts9wifi.dtb \
                --initramfs /tmp/initramfs.img \
                --cmdline /work/boot/cmdline.txt \
                --bootconfig /work/boot/bootconfig.txt --out out-bundle
              shopt -s nullglob
              kernel_rpms=(out-kernel/linux-gts9wifi-*.rpm)
              [ "${#kernel_rpms[@]}" -eq 1 ] || { echo "expected exactly one linux-gts9wifi RPM" >&2; exit 1; }
              (cd out-kernel && sha256sum "$(basename "${kernel_rpms[0]}")" > RPM-SHA256SUMS)
              kernel_rpm_nevra=$(rpm -qp --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}" "${kernel_rpms[0]}")
              kernel_rpm_sha256=$(sha256sum "${kernel_rpms[0]}" | cut -d" " -f1)
              firmware_sha256=$(sha256sum /tmp/fw.tar.gz | cut -d" " -f1)
              builder_rpm_inventory_sha256=$(rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\\n" | LC_ALL=C sort | sha256sum | cut -d" " -f1)
              {
                printf "kernel_rpm_nevra=%s\\n" "$kernel_rpm_nevra"
                printf "kernel_rpm_sha256=%s\\n" "$kernel_rpm_sha256"
                printf "firmware_sha256=%s\\n" "$firmware_sha256"
                printf "firmware_source_url=%s\\n" "$FIRMWARE_URL"
                printf "repository_commit=%s\\n" "$BUILD_SOURCE_SHA"
                printf "builder_image=quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a\\n"
                printf "fedora_base_compose=%s\\n" "$FEDORA_BASE_COMPOSE"
                printf "fedora_updates_compose=%s\\n" "$FEDORA_UPDATES_COMPOSE"
                printf "builder_rpm_inventory_sha256=%s\\n" "$builder_rpm_inventory_sha256"
                printf "kernel_source_url=https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.tar.xz\\n"
                printf "kernel_source_sha256=%s\\n" "$LINUX_SOURCE_SHA256"
                printf "kernel_source=linux-7.2.0 plus repository kernel/prepare.sh and patches\\n"
                printf "x810_build_key=%s\\n" "$BUILD_KEY"
              } >> out-bundle/BUILD-METADATA.txt
              python3 /work/tools/make-twrp-zip.py out-bundle out-twrp/gts9wifi-fedora-"$KVER".zip --project /work
              printf "%s\\n" "$BUILD_KEY" > out-bundle/KERNEL-BUILD-KEY.txt
              (cd out-bundle && sha256sum KERNEL-BUILD-KEY.txt >> SHA256SUMS)
              ccache --show-stats
              mv out-bundle/SHA256SUMS out-bundle/BUNDLE-SHA256SUMS
            '

      - name: Make cache files readable by the runner
        if: success()
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            "$RUNNER_TEMP/x810-kernel-cache" "$RUNNER_TEMP/x810-dnf-kernel-cache" || true

      - name: Save kernel source and ccache
        if: success() && steps.restore_kernel_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-kernel-cache
          key: x810-kernel-${{ runner.arch }}-linux72-${{ hashFiles('kernel/**') }}

      - name: Save Fedora DNF cache
        if: success() && steps.restore_kernel_dnf.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-dnf-kernel-cache
          key: x810-dnf-kernel-${{ runner.arch }}-${{ needs.plan.outputs.fedora_base_compose }}-${{ needs.plan.outputs.fedora_updates_compose }}

      - name: Publish assets to the named kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ needs.plan.outputs.kernel_tag }}
        run: |
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --title "$REL" --latest=false \
              --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release edit "$REL" --latest=false
          gh release upload "$REL" --clobber \
            out-kernel/*.rpm out-kernel/RPM-SHA256SUMS \
            out-bundle/*.img out-bundle/BUNDLE-SHA256SUMS out-bundle/BUILD-METADATA.txt out-bundle/KERNEL-BUILD-KEY.txt \
            out-twrp/*.zip

  resolve_rootfs:
    needs: [plan, build_kernel]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.build_kernel.result == 'success' || needs.build_kernel.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      kernel_rpm_sha256: ${{ steps.resolve.outputs.kernel_rpm_sha256 }}
      rootfs_key: ${{ steps.resolve.outputs.rootfs_key }}
      rootfs_tag: ${{ steps.resolve.outputs.rootfs_tag }}
      build_rootfs: ${{ steps.resolve.outputs.build_rootfs }}
      full_set_tag: ${{ steps.resolve.outputs.full_set_tag }}
      full_set_key: ${{ steps.resolve.outputs.full_set_key }}
      build_full_set: ${{ steps.resolve.outputs.build_full_set }}
    steps:
      - name: Checkout sources for rootfs key calculation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify selected kernel release and plan rootfs/full-set
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_TAG: ${{ needs.plan.outputs.kernel_tag }}
          KERNEL_KEY: ${{ needs.plan.outputs.kernel_key }}
          IS_BOOTSTRAP: ${{ needs.plan.outputs.bootstrap_kernel }}
          FORCE_REBUILD: ${{ needs.plan.outputs.force_rebuild }}
          PORT_VERSION: ${{ needs.plan.outputs.port_version }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
          FEDORA_BASE_COMPOSE: ${{ needs.plan.outputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ needs.plan.outputs.fedora_updates_compose }}
          FIRMWARE_SHA256: 30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5
        run: |
          set -euo pipefail
          kdir="$RUNNER_TEMP/selected-kernel-${GITHUB_RUN_ID}"
          mkdir -p "$kdir"
          download_patterns=(
            --pattern BUILD-METADATA.txt
            --pattern BUNDLE-SHA256SUMS
            --pattern RPM-SHA256SUMS
            --pattern 'linux-gts9wifi-*.rpm'
            --pattern '*.img'
            --pattern 'gts9wifi-fedora-*.zip'
          )
          # The validated one-time bootstrap kernel predates build-key assets.
          if [ "$IS_BOOTSTRAP" != true ]; then
            download_patterns+=(--pattern KERNEL-BUILD-KEY.txt)
          fi
          gh release download "$KERNEL_TAG" --repo "$GITHUB_REPOSITORY" --dir "$kdir" "${download_patterns[@]}"
          (cd "$kdir" && sha256sum -c BUNDLE-SHA256SUMS && sha256sum -c RPM-SHA256SUMS)
          if [ -f "$kdir/KERNEL-BUILD-KEY.txt" ]; then
            [ "$(cat "$kdir/KERNEL-BUILD-KEY.txt")" = "$KERNEL_KEY" ] || {
              echo "REFUSING: kernel release fingerprint doesn't match the plan." >&2; exit 1;
            }
          elif [ "$IS_BOOTSTRAP" != true ]; then
            echo "REFUSING: a non-bootstrap kernel release lacks its build-key asset." >&2; exit 1
          fi
          shopt -s nullglob
          rpms=("$kdir"/linux-gts9wifi-*.rpm)
          [ "${#rpms[@]}" -eq 1 ] || { echo "REFUSING: expected exactly one kernel RPM." >&2; exit 1; }
          kernel_rpm_sha256="$(sha256sum "${rpms[0]}" | cut -d' ' -f1)"

          rootfs_key="$(python3 tools/x810-build-fingerprint.py rootfs \
            --ref "$GITHUB_SHA" --fedora-release 44 \
            --fedora-base-compose "$FEDORA_BASE_COMPOSE" \
            --fedora-updates-compose "$FEDORA_UPDATES_COMPOSE" \
            --desktop "$DESKTOP" --port-version "$PORT_VERSION" \
            --firmware-sha256 "$FIRMWARE_SHA256" \
            --kernel-rpm-sha256 "$kernel_rpm_sha256")"
          rootfs_base="x810-rootfs-f44-${DESKTOP}-${rootfs_key:0:16}"
          build_rootfs=true
          if [ "$FORCE_REBUILD" = true ]; then
            rootfs_tag="${rootfs_base}-r${GITHUB_RUN_ID}"
          else
            reusable=""
            release_list="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json tagName,publishedAt --jq \
              "sort_by(.publishedAt) | reverse | map(select(.tagName | startswith(\"${rootfs_base}\"))) | .[].tagName" 2>/dev/null || true)"
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              rdir="$RUNNER_TEMP/rootfs-check-${GITHUB_RUN_ID}-${RANDOM}"
              mkdir -p "$rdir"
              if gh release download "$candidate" --repo "$GITHUB_REPOSITORY" --dir "$rdir" \
                  --pattern ROOTFS-BUILD-KEY.txt --pattern SHA256SUMS \
                  --pattern '*.tar.gz' --pattern '*.rpm' --pattern rootfs-manifest.txt >/dev/null 2>&1 && \
                 [ "$(cat "$rdir/ROOTFS-BUILD-KEY.txt" 2>/dev/null || true)" = "$rootfs_key" ] && \
                 (cd "$rdir" && sha256sum -c SHA256SUMS >/dev/null); then
                reusable="$candidate"; break
              fi
            done <<< "$release_list"
            if [ -n "$reusable" ]; then
              rootfs_tag="$reusable"
              build_rootfs=false
            else
              rootfs_tag="$rootfs_base"
            fi
          fi

          full_key="$(python3 tools/x810-build-fingerprint.py full-set \
            --ref "$GITHUB_SHA" --port-version "$PORT_VERSION" \
            --kernel-build-key "$KERNEL_KEY" --rootfs-build-key "$rootfs_key")"
          full_tag="x810-fedora-${PORT_VERSION}-${full_key:0:20}"
          if [ "$FORCE_REBUILD" = true ]; then full_tag="${full_tag}-r${GITHUB_RUN_ID}"; fi
          build_full_set=true
          if [ "$FORCE_REBUILD" != true ]; then
            current_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [ "$current_latest" = "$full_tag" ]; then
              fdir="$RUNNER_TEMP/fullset-check-${GITHUB_RUN_ID}"
              mkdir -p "$fdir"
              if gh release download "$full_tag" --repo "$GITHUB_REPOSITORY" --dir "$fdir" \
                  --pattern KERNEL-BUILD-KEY.txt --pattern ROOTFS-BUILD-KEY.txt \
                  --pattern FULL-SET-BUILD-KEY.txt \
                  --pattern port-release.json --pattern 'x810-fedora-sm-x810-*-clean-install.tar.gz' >/dev/null 2>&1 && \
                 [ "$(cat "$fdir/KERNEL-BUILD-KEY.txt" 2>/dev/null || true)" = "$KERNEL_KEY" ] && \
                 [ "$(cat "$fdir/ROOTFS-BUILD-KEY.txt" 2>/dev/null || true)" = "$rootfs_key" ] && \
                 [ "$(cat "$fdir/FULL-SET-BUILD-KEY.txt" 2>/dev/null || true)" = "$full_key" ]; then
                build_full_set=false
              fi
            fi
          fi
          {
            echo "kernel_rpm_sha256=$kernel_rpm_sha256"
            echo "rootfs_key=$rootfs_key"
            echo "rootfs_tag=$rootfs_tag"
            echo "build_rootfs=$build_rootfs"
            echo "full_set_tag=$full_tag"
            echo "full_set_key=$full_key"
            echo "build_full_set=$build_full_set"
          } >> "$GITHUB_OUTPUT"
          {
            echo "- Kernel RPM SHA-256: `$kernel_rpm_sha256`"
            echo "- Rootfs: **$([ "$build_rootfs" = true ] && echo build || echo reuse)** `$rootfs_tag`"
            echo "- Combined release: **$([ "$build_full_set" = true ] && echo assemble-or-promote || echo already-current)** `$full_tag`"
          } >> "$GITHUB_STEP_SUMMARY"

  build_rootfs:
    needs: [plan, build_kernel, resolve_rootfs]
    if: >-
      always() && needs.plan.result == 'success' && needs.resolve_rootfs.result == 'success' &&
      (needs.build_kernel.result == 'success' || needs.build_kernel.result == 'skipped') &&
      needs.resolve_rootfs.outputs.build_rootfs == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run rootfs Fedora signing-key contract test
        run: python3 tools/test-rootfs-repo-gpg.py

      - name: Verify planned rootfs fingerprint
        env:
          FEDORA_RELEASE: "44"
          FEDORA_BASE_COMPOSE: ${{ needs.plan.outputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ needs.plan.outputs.fedora_updates_compose }}
          GTS9_DESKTOP: ${{ needs.plan.outputs.desktop }}
          PORT_VERSION: ${{ needs.plan.outputs.port_version }}
          FIRMWARE_SHA256: 30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5
          KERNEL_RPM_SHA256: ${{ needs.resolve_rootfs.outputs.kernel_rpm_sha256 }}
          EXPECTED_BUILD_KEY: ${{ needs.resolve_rootfs.outputs.rootfs_key }}
        run: |
          set -euo pipefail
          actual="$(python3 tools/x810-build-fingerprint.py rootfs \
            --fedora-release "$FEDORA_RELEASE" \
            --fedora-base-compose "$FEDORA_BASE_COMPOSE" \
            --fedora-updates-compose "$FEDORA_UPDATES_COMPOSE" \
            --desktop "$GTS9_DESKTOP" --port-version "$PORT_VERSION" \
            --firmware-sha256 "$FIRMWARE_SHA256" \
            --kernel-rpm-sha256 "$KERNEL_RPM_SHA256")"
          [ "$actual" = "$EXPECTED_BUILD_KEY" ] || {
            echo "REFUSING: rootfs build inputs changed after planning." >&2; exit 1;
          }

      - name: Restore DNF cache for exact immutable Fedora composes
        id: restore_dnf_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-dnf-rootfs-cache
          key: x810-dnf-rootfs-${{ runner.arch }}-44-${{ needs.plan.outputs.fedora_base_compose }}-${{ needs.plan.outputs.fedora_updates_compose }}

      - name: Fetch pinned firmware payload
        env:
          FIRMWARE_URL: https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-2/firmware-samsung-gts9wifi-v2.tar.gz
          FIRMWARE_SHA256: 30cace40556fdaf1577c76bedc1b1a6236f4acc23e9300253b3834fa7ed4bab5
        run: |
          mkdir -p _ci
          curl -sfL "$FIRMWARE_URL" -o _ci/firmware.tar.gz
          echo "$FIRMWARE_SHA256  _ci/firmware.tar.gz" | sha256sum -c -

      - name: Download the exact RPM from this repository's X810 kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RELEASE_TAG: ${{ needs.plan.outputs.kernel_tag }}
          KERNEL_RPM_SHA256: ${{ needs.resolve_rootfs.outputs.kernel_rpm_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p _ci/kernel
          gh release download "$KERNEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'linux-gts9wifi-*.rpm' --pattern RPM-SHA256SUMS --dir _ci/kernel
          (cd _ci/kernel && sha256sum -c RPM-SHA256SUMS)
          shopt -s nullglob
          rpms=(_ci/kernel/linux-gts9wifi-*.rpm)
          [ "${#rpms[@]}" -eq 1 ] || {
            echo "REFUSING: kernel release must contain exactly one X810 linux-gts9wifi RPM." >&2
            exit 1
          }
          cp "${rpms[0]}" _ci/kernel.rpm
          echo "$KERNEL_RPM_SHA256  _ci/kernel.rpm" | sha256sum -c -

      - name: Build rootfs in Fedora aarch64 container
        id: build_rootfs_image
        env:
          PORT_VERSION: ${{ needs.plan.outputs.port_version }}
          FEDORA_RELEASE: "44"
          FEDORA_BASE_COMPOSE: ${{ needs.plan.outputs.fedora_base_compose }}
          FEDORA_UPDATES_COMPOSE: ${{ needs.plan.outputs.fedora_updates_compose }}
          GTS9_DESKTOP: ${{ needs.plan.outputs.desktop }}
          FIRMWARE_URL: https://github.com/nacht20-de/gts9wifi-fedora/releases/download/kernel-7.2.0-rc3-gts9wifi-2/firmware-samsung-gts9wifi-v2.tar.gz
          BUILD_KEY: ${{ needs.resolve_rootfs.outputs.rootfs_key }}
        run: |
          mkdir -p "$RUNNER_TEMP/x810-dnf-rootfs-cache"
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$RUNNER_TEMP/x810-dnf-rootfs-cache:/x810-dnf-cache" \
            -e FEDORA_RELEASE -e FEDORA_BASE_COMPOSE -e FEDORA_UPDATES_COMPOSE \
            -e GTS9_DESKTOP -e PORT_VERSION \
            -e FIRMWARE_TARBALL=/work/_ci/firmware.tar.gz \
            -e FIRMWARE_SOURCE_URL="$FIRMWARE_URL" \
            -e KERNEL_RPM=/work/_ci/kernel.rpm \
            -e X810_DNF_CACHE_DIR=/x810-dnf-cache \
            -e BUILDER_IMAGE=quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a \
            quay.io/fedora/fedora@sha256:e75c580674741c20556f49c24e2d1417b0455abcbda807ce9e3e3acd8765379a \
            ./rootfs/build-rootfs.sh
          sudo chown -R "$(id -u):$(id -g)" out
          printf '%s\n' "$BUILD_KEY" > out/ROOTFS-BUILD-KEY.txt

      - name: Finalize external DNF cache after build attempt
        id: finalize_dnf_cache
        if: ${{ always() && !cancelled() && steps.build_rootfs_image.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/x810-dnf-rootfs-cache"
          mkdir -p "$cache_dir"
          sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
          find "$cache_dir" -type f \( -name '*.part' -o -name '*.tmp' \) -delete
          if find "$cache_dir" -type f -print -quit | grep -q .; then
            echo "has_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save DNF cache for exact immutable Fedora composes
        if: ${{ always() && !cancelled() && steps.restore_dnf_cache.outputs.cache-hit != 'true' && steps.finalize_dnf_cache.outcome == 'success' && steps.finalize_dnf_cache.outputs.has_cache == 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/x810-dnf-rootfs-cache
          key: x810-dnf-rootfs-${{ runner.arch }}-44-${{ needs.plan.outputs.fedora_base_compose }}-${{ needs.plan.outputs.fedora_updates_compose }}

      - name: Checksum
        run: |
          cd out
          shopt -s nullglob
          assets=( *.tar.gz *.rpm rootfs-manifest.txt ROOTFS-BUILD-KEY.txt )
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish assets to the named rootfs release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ needs.resolve_rootfs.outputs.rootfs_tag }}
        run: |
          gh release view "$REL" >/dev/null 2>&1 || \
            gh release create "$REL" --title "$REL" --latest=false \
              --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release edit "$REL" --latest=false
          shopt -s nullglob
          assets=(out/*.tar.gz out/*.rpm out/rootfs-manifest.txt out/SHA256SUMS out/ROOTFS-BUILD-KEY.txt)
          gh release upload "$REL" --clobber "${assets[@]}"

  publish_full_set:
    needs: [plan, build_kernel, resolve_rootfs, build_rootfs]
    if: >-
      always() && needs.plan.result == 'success' && needs.resolve_rootfs.result == 'success' &&
      (needs.build_kernel.result == 'success' || needs.build_kernel.result == 'skipped') &&
      (needs.build_rootfs.result == 'success' || needs.build_rootfs.result == 'skipped') &&
      needs.resolve_rootfs.outputs.build_full_set == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install RPM inspection tools
        run: |
          if ! command -v rpm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi

      - name: Validate, assemble, and publish the combined release
        env:
          GH_TOKEN: ${{ github.token }}
          KREL: ${{ needs.plan.outputs.kernel_tag }}
          RREL: ${{ needs.resolve_rootfs.outputs.rootfs_tag }}
          REL: ${{ needs.resolve_rootfs.outputs.full_set_tag }}
          PORT_VERSION: ${{ needs.plan.outputs.port_version }}
          KERNEL_BUILD_KEY: ${{ needs.plan.outputs.kernel_key }}
          EXPECTED_FULL_SET_KEY: ${{ needs.resolve_rootfs.outputs.full_set_key }}
        run: bash tools/publish-x810-full-set.sh
