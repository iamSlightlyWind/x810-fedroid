# Generic image: root is found via root=UUID= on the vendor_boot cmdline.
hostonly="no"
compress="gzip"
# Root storage is built into the kernel (=y); the gadget modules are not.
add_drivers+=" configfs libcomposite usb_f_rndis dwc3 dwc3-qcom "
# Adreno and Iris are built-in and can probe during the initramfs, before the
# real root (which carries the support-RPM firmware) is mounted. Stage the
# exact CYG1 VPU image in the kernel build and include it here, or Iris logs
# request_firmware(...vpu30_4v.mbn) -ENOENT and cannot initialize.
install_items+=" /usr/lib/firmware/qcom/a740_sqe.fw /usr/lib/firmware/qcom/gmu_gen70200.bin /usr/lib/firmware/qcom/a740_zap.mdt /usr/lib/firmware/qcom/a740_zap.b00 /usr/lib/firmware/qcom/a740_zap.b01 /usr/lib/firmware/qcom/a740_zap.b02 /usr/lib/firmware/qcom/vpu/vpu30_4v.mbn "
